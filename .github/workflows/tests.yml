name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  # GitHub Actions schedules are evaluated in UTC and only from the
  # repository default branch.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Only a newer push to the same pull request cancels a run. Pushes to master,
# the weekly scheduled run and manually dispatched runs (the two that run the
# dataset-download smoke) share a ref, so each event type gets its own group
# and none cancels another. Within a group that does not cancel, such as
# pushes to master, a new run waits for the running one (GitHub keeps only
# the newest waiting run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.5"

      - name: Run ruff
        run: python -m ruff check solver_benchmarks tests problem_classes scripts tools

      # tools/ and scripts/ are run by hand, not imported by the package, so
      # make sure every file still compiles (tests/test_tools.py imports and
      # exercises the campaign tools; bench_modal.py needs Modal to import).
      - name: Compile tools and scripts
        run: python -m compileall -q tools scripts

  type-check:
    # The 3.11 cell keeps the job's original name, "Type check", which
    # branch protection rules may require.
    name: ${{ matrix.check-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python (keep it aligned with
        # [tool.mypy].python_version in pyproject.toml, which mypy checks
        # against in both cells) and the newest, which installs the newest
        # numpy and scipy and so the newest type stubs.
        include:
          - python-version: "3.11"
            check-name: "Type check"
          - python-version: "3.14"
            check-name: "Type check - Python 3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,all]" "mypy>=1.10"

      - name: Run mypy
        run: python -m mypy solver_benchmarks

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      # Every open-source extra is installed here, so a solver that is not
      # available is a packaging or import regression: fail its integration
      # test instead of skipping it.
      BENCH_REQUIRE_ALL_SOLVERS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,all]"

      # Tests marked slow (minutes each) run once, in the coverage job.
      - name: Run tests
        run: python -m pytest -m "not network and not slow"

      - name: Smoke-test CLI
        run: python -m solver_benchmarks.cli list solvers

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      BENCH_REQUIRE_ALL_SOLVERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with coverage tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,all]" "pytest-cov>=4.0"

      # The one job that also runs the tests marked slow.
      - name: Run tests with coverage
        run: |
          python -m pytest -m "not network" \
            --cov=solver_benchmarks \
            --cov-report=term-missing \
            --cov-fail-under=70

  dataset-download-smoke:
    name: Dataset download smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,clarabel]"

      - name: Verify external dataset download paths
        run: python -m pytest -m network tests/test_dataset_downloads.py

  solver-smoke:
    name: Solver smoke - ${{ matrix.solver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: clarabel
            extra: clarabel
          - solver: cpo3
            extra: cpo3
          - solver: cvxopt
            extra: cvxopt
          - solver: ecos
            extra: ecos
          - solver: highs
            extra: highs
          - solver: osqp
            extra: osqp
          - solver: pdlp
            extra: pdlp
          - solver: piqp
            extra: piqp
          - solver: proxqp
            extra: proxqp
          - solver: qtqp
            extra: qtqp
          - solver: scs
            extra: scs
          - solver: sdpa
            extra: sdpa

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install solver extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,${{ matrix.extra }}]"

      - name: Run solver smoke benchmark
        run: python scripts/ci_solver_smoke.py "${{ matrix.solver }}"

  pdlp-compatibility:
    name: PDLP native compatibility - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Exercise native dependency compatibility on Python 3.11 and 3.14.
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PDLP and MPS reader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,pdlp]"
      - name: Verify native import orders and MPS to PDLP solves
        run: python -m pytest tests/test_pdlp_compatibility.py

  commercial-adapters:
    name: Commercial adapter registration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify commercial adapters are optional
        run: |
          python - <<'PY'
          from solver_benchmarks.solvers import get_solver

          for name in ("cplex", "gurobi", "mosek"):
              solver = get_solver(name)
              assert solver.solver_name == name
              assert isinstance(solver.is_available(), bool)
          PY
