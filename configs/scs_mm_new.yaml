run:
  dataset: maros_meszaros
  output_dir: results
  parallelism: 4
  resume: true
  timeout_seconds: 100

solvers:
  - id: scs_default_new
    solver: scs
    settings:
      eps_abs: 1.0e-6
      eps_rel: 1.0e-6
      max_iters: 1000000

  - id: scs_diag3_aa
    solver: scs
    settings:
      eps_abs: 1.0e-6
      eps_rel: 1.0e-6
      max_iters: 1000000
      adaptive_diag_scale: 3

  - id: scs_restart_diag3
    solver: scs
    settings:
      eps_abs: 1.0e-6
      eps_rel: 1.0e-6
      max_iters: 1000000
      restart: true
      adaptive_diag_scale: 3
