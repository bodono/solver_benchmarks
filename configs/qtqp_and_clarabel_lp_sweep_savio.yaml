run:
  output_dir: results
  # Sized for one full Savio savio4_htc node (Intel Xeon Gold 6330, 56 cores
  # per node). The bench runner spawns one solver subprocess per worker
  # thread, so this saturates the node's cores without spilling.
  parallelism: 56
  resume: true
  timeout_seconds: 300
  # miplib data must be prepared first; setting auto_prepare_data lets the
  # runner download the matching subset (max_size_mb=5) on first invocation
  # so the user doesn't have to remember `bench data prepare miplib` separately.
  # If the cluster blocks outbound network on compute nodes, run
  # `bench data prepare miplib` from a login node and flip this to false.
  auto_prepare_data: true
  # Shared scratch root for the two datasets that need cached data.
  # Savio home dirs are quota-limited; scratch is large and fast, and
  # one base path keeps every cache under a single easy-to-prune tree:
  #     /global/scratch/users/matteosantamaria/solver_benchmarks_data/
  #         miplib_data/                      (downloaded from miplib.zib.de)
  #         maros_meszaros_v2_data/*.h5       (extracted from the R2 zip)
  datasets:
    - id: miplib_under_5mb
      name: miplib
      dataset_options:
        max_size_mb: 5.0
        # Resolved as <data_root>/miplib_data/.
        data_root: /global/scratch/users/matteosantamaria/solver_benchmarks_data
    - name: netlib
    - name: kennington
    - name: maros_meszaros
    # `data_dir` is the directory the .h5 files live in (read from) and,
    # on first run, the directory the qpkit-data zip is downloaded and
    # extracted into. Triggered by `auto_prepare_data` above; pulls
    # from the private Cloudflare R2 bucket. The SLURM job needs
    # R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY (or AWS_*) in env.
    # Subsequent jobs reuse the extracted files and skip the download.
    - name: maros_meszaros_v2
      dataset_options:
        data_dir: /global/scratch/users/matteosantamaria/solver_benchmarks_data/maros_meszaros_v2_data

# 3 inits × 2 refinement strategies × 3 equilibration cadences × 2
# equilibration methods = 36 configs per solver, 72 total entries. Symmetric
# across both solver families so each (init, ref, epi, eq) cell can be
# compared 1:1 between qtqp and qtqp_clarabel.
solvers:
  - id: qtqp
    solver: qtqp
    settings:
      linear_solver: QDLDL
      verbose: false
    sweep:
      initialization: [TRIVIAL, CVXOPT, LEAST_SQUARES]
      refinement_strategy: [fixed_point, fgmres]
      equilibrate_per_iteration: [0, 3, 10]
      equilibration_method: [kkt, augmented_kkt]
    id_template: "qtqp__init={initialization}__ref={refinement_strategy}__epi={equilibrate_per_iteration}__eq={equilibration_method}"

  - id: qtqp_clarabel
    solver: qtqp_clarabel
    settings:
      linear_solver: QDLDL
      verbose: false
    sweep:
      initialization: [TRIVIAL, CVXOPT, LEAST_SQUARES]
      refinement_strategy: [fixed_point, fgmres]
      equilibrate_per_iteration: [0, 3, 10]
      equilibration_method: [kkt, augmented_kkt]
    id_template: "qtqp_clarabel__init={initialization}__ref={refinement_strategy}__epi={equilibrate_per_iteration}__eq={equilibration_method}"
