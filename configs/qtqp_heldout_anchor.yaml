run:
  name: qtqp_heldout_anchor
  output_dir: results
  parallelism: 6
  resume: true
  timeout_seconds: 1800
  datasets:
  - id: kennington
    name: kennington
  - id: qplib
    name: qplib
  - id: dc_opf
    name: dc_opf
  - id: libsvm_qp
    name: libsvm_qp
  - id: mpc_qpbenchmark
    name: mpc_qpbenchmark
  - id: netlib
    name: netlib
    dataset_options:
      subset: infeasible
solvers:
- id: qtqp_sphere_anchor
  solver: qtqp
  settings:
    atol: 1.0e-09
    rtol: 1.0e-09
    max_iter: 200
    linear_solver: qdldl
    init_strategy: cvxopt
