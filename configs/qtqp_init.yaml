# EXPERIMENTAL: needs an unreleased QTQP build that accepts init_strategy; and
# the qdldl Python package (pip install qdldl), which the qtqp extra does not
# install. With only the released solvers from the package extras, the
# init_strategy arms are not run (their settings are rejected: the run
# finishes the other arms and exits with an error naming them; remove them for
# a clean exit), and the qdldl arms fail as worker_error. See
# configs/README.md.
run:
  name: qtqp_init
  output_dir: results
  parallelism: 6
  resume: true
  exclude:
  - AUG2D
  - AUG2DC
  - AUG3D
  - AUG3DC
  - DPKLO1
  - DTOC3
  - GENHS28
  - HS51
  - HS52
  timeout_seconds: 1800
  datasets:
  - id: maros_meszaros
    name: maros_meszaros
  - id: netlib
    name: netlib
    dataset_options:
      subset: feasible
  - id: miplib
    name: miplib
solvers:
- id: qtqp_trivial_init
  solver: qtqp
  settings:
    tol_feas: 1.0e-09
    tol_gap_abs: 1.0e-09
    tol_gap_rel: 1.0e-09
    max_iter: 200
    linear_solver: qdldl
- id: qtqp_cvxopt_init
  solver: qtqp
  settings:
    tol_feas: 1.0e-09
    tol_gap_abs: 1.0e-09
    tol_gap_rel: 1.0e-09
    max_iter: 200
    linear_solver: qdldl
    init_strategy: cvxopt
