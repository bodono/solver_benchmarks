run:
  output_dir: results
  parallelism: 8
  resume: true
  timeout_seconds: 100
  datasets:
  - id: netlib_feasible
    name: netlib
    dataset_options:
      subset: feasible
  - name: maros_meszaros
solvers:
- id: v3_center
  solver: scs
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    adaptive_diag_scale: 3
    acceleration_interval: 5
- id: v3_alpha12
  solver: scs
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    adaptive_diag_scale: 3
    acceleration_interval: 5
    alpha: 1.2
- id: v3_alpha18
  solver: scs
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    adaptive_diag_scale: 3
    acceleration_interval: 5
    alpha: 1.8
- id: v3_scale003
  solver: scs
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    adaptive_diag_scale: 3
