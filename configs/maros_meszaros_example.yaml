run:
  dataset: maros_meszaros
  output_dir: results
  include:
    - AUG2D
    - CVXQP1_S
  parallelism: 2
  resume: true
  timeout_seconds: 300

solvers:
  # QTQP's default backend: MKL Pardiso on x86-64 Linux and Windows, Apple
  # Accelerate on arm64 macOS (both installed by the qtqp extra there).
  - id: qtqp_default
    solver: qtqp

  # SciPy's sparse LU, installed with QTQP on every platform.
  - id: qtqp_scipy
    solver: qtqp
    settings:
      linear_solver: scipy

  - id: scs_default
    solver: scs
    settings:
      eps_abs: 1.0e-4
      eps_rel: 1.0e-4
      max_iters: 100000

  - id: clarabel_default
    solver: clarabel
    settings:
      max_iter: 200
