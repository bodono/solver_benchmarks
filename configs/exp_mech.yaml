# EXPERIMENTAL: needs an unreleased SCS build that accepts adaptive_alpha,
# adaptive_diag_scale values above 1, den_floor_frac, num_l2_passes and
# restart. With only the released solvers from the package extras, the solves
# that need them fail as worker_error. See configs/README.md.
run:
  output_dir: results
  parallelism: 8
  resume: false
  timeout_seconds: 60
  datasets:
  - id: netlib
    name: netlib
    dataset_options:
      subset: feasible
  - id: maros_meszaros
    name: maros_meszaros

solvers:
- id: base
  solver: scs
  settings: {eps_abs: 1.0e-06, eps_rel: 1.0e-06, max_iters: 1000000, adaptive_diag_scale: 10, den_floor_frac: 1.0e-03, acceleration_interval: 5, num_l2_passes: -1}
- id: hybrid
  solver: scs
  settings: {eps_abs: 1.0e-06, eps_rel: 1.0e-06, max_iters: 1000000, adaptive_diag_scale: 10, den_floor_frac: 1.0e-03, acceleration_interval: 5, num_l2_passes: -1, restart: 2}
- id: adaptive_alpha
  solver: scs
  settings: {eps_abs: 1.0e-06, eps_rel: 1.0e-06, max_iters: 1000000, adaptive_diag_scale: 10, den_floor_frac: 1.0e-03, acceleration_interval: 5, num_l2_passes: -1, adaptive_alpha: 1}
