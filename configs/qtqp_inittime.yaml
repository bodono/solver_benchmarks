# EXPERIMENTAL: needs an unreleased QTQP build that accepts init_strategy; and
# the qdldl Python package (pip install qdldl), which the qtqp extra does not
# install. With only the released solvers from the package extras, the solves
# that need them fail as worker_error. See configs/README.md.
run:
  name: qtqp_inittime
  output_dir: results
  parallelism: 6
  resume: true
  timeout_seconds: 1800
  datasets:
  - id: kennington
    name: kennington
solvers:
- id: qtqp_cvxopt
  solver: qtqp
  settings:
    tol_feas: 1.0e-09
    tol_gap_abs: 1.0e-09
    tol_gap_rel: 1.0e-09
    max_iter: 200
    linear_solver: qdldl
    init_strategy: cvxopt
