run:
  output_dir: results/regress331_kennington
  parallelism: 8
  resume: true
  timeout_seconds: 300
  datasets:
  - id: kennington
    name: kennington
solvers:
- id: scs_e5
  solver: scs
  settings:
    eps_abs: 1.0e-05
    eps_rel: 1.0e-05
    max_iters: 1000000
- id: scs_e6
  solver: scs
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
