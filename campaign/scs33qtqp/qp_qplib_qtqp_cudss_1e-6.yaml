run:
  name: qp_qplib_qtqp_cudss_1e-6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: qplib
    id: qplib
    dataset_options:
      subset: all
solvers:
- id: qtqp_cudss_1e-6
  solver: qtqp
  settings:
    atol: 1.0e-06
    rtol: 1.0e-06
    max_iter: 200
    verbose: false
    linear_solver: cudss
