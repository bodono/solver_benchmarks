run:
  name: qp_qplib_qtqp_mkl_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: qplib
    id: qplib
    dataset_options:
      subset: all
solvers:
- id: qtqp_mkl_1e-4
  solver: qtqp
  settings:
    tol_feas: 0.0001
    tol_gap_abs: 0.0001
    tol_gap_rel: 0.0001
    max_iter: 200
    verbose: false
    linear_solver: pardiso
