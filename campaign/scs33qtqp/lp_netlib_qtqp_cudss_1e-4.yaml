run:
  name: lp_netlib_qtqp_cudss_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: netlib
    id: netlib
    dataset_options:
      subset: feasible
solvers:
- id: qtqp_cudss_1e-4
  solver: qtqp
  settings:
    tol_feas: 0.0001
    tol_gap_abs: 0.0001
    tol_gap_rel: 0.0001
    max_iter: 200
    verbose: false
    linear_solver: cudss
