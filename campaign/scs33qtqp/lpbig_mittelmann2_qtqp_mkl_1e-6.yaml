run:
  name: lpbig_mittelmann2_qtqp_mkl_1e-6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 1860.0
  datasets:
  - name: mittelmann
    id: mittelmann2
    include:
    - L1_sixm1000obs
    - L1_sixm250obs
    - L2CTA3D
    - Linf_520c
    - brazil3
    - rmine15
    - s250r10
    - s82
    - savsched1
    - set-cover-model
    - square41
    - woodlands09
solvers:
- id: qtqp_mkl_1e-6
  solver: qtqp
  settings:
    tol_feas: 1.0e-06
    tol_gap_abs: 1.0e-06
    tol_gap_rel: 1.0e-06
    max_iter: 200
    verbose: false
    linear_solver: pardiso
