run:
  name: qp_qplib_qtqp_cudss_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: qplib
    id: qplib
    dataset_options:
      subset: all
solvers:
- id: qtqp_cudss_1e-4
  solver: qtqp
  settings:
    atol: 0.0001
    rtol: 0.0001
    max_iter: 200
    verbose: false
    linear_solver: cudss
