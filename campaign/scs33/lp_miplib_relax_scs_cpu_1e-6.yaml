run:
  name: lp_miplib_relax_scs_cpu_1e-6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: miplib
    id: miplib_relax
    dataset_options:
      max_size_mb: 20
solvers:
- id: scs_cpu_1e-6
  solver: scs
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    time_limit_secs: 300.0
