run:
  name: qp_mpc_proxqp_1e-6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: mpc_qpbenchmark
    id: mpc
    dataset_options:
      subset: all
solvers:
- id: proxqp_1e-6
  solver: proxqp
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iter: 1000000
    time_limit: 300.0
