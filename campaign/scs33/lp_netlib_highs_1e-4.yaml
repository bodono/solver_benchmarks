run:
  name: lp_netlib_highs_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: netlib
    id: netlib
    dataset_options:
      subset: feasible
solvers:
- id: highs_1e-4
  solver: highs
  settings:
    primal_feasibility_tolerance: 0.0001
    dual_feasibility_tolerance: 0.0001
    time_limit: 300.0
