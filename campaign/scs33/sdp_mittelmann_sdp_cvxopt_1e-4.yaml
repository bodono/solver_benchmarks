run:
  name: sdp_mittelmann_sdp_cvxopt_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
  datasets:
  - name: mittelmann_sdp
    id: mittelmann_sdp
    dataset_options:
      subset: all
solvers:
- id: cvxopt_1e-4
  solver: cvxopt
  settings:
    abstol: 0.0001
    reltol: 0.0001
    feastol: 0.0001
