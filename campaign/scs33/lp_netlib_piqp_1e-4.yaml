run:
  name: lp_netlib_piqp_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: netlib
    id: netlib
    dataset_options:
      subset: feasible
solvers:
- id: piqp_1e-4
  solver: piqp
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    max_iter: 1000000
    time_limit: 300.0
