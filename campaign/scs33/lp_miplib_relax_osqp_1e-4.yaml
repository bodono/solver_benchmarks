run:
  name: lp_miplib_relax_osqp_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: miplib
    id: miplib_relax
    dataset_options:
      max_size_mb: 20
solvers:
- id: osqp_1e-4
  solver: osqp
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    max_iter: 1000000
    time_limit: 300.0
