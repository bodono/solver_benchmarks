run:
  name: lp_netlib_pdlp_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: netlib
    id: netlib
    dataset_options:
      subset: feasible
solvers:
- id: pdlp_1e-4
  solver: pdlp
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    solver_time_limit_sec: 300.0
