run:
  name: lp_miplib_relax_cuopt_1e-6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: miplib
    id: miplib_relax
    dataset_options:
      max_size_mb: 20
solvers:
- id: cuopt_1e-6
  solver: cuopt
  settings:
    eps: 1.0e-06
    time_limit: 300.0
