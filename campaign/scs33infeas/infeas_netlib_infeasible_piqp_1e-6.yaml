run:
  name: infeas_netlib_infeasible_piqp_1e-6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: netlib
    id: netlib_infeasible
    dataset_options:
      subset: infeasible
solvers:
- id: piqp_1e-6
  solver: piqp
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iter: 1000000
    time_limit: 300.0
