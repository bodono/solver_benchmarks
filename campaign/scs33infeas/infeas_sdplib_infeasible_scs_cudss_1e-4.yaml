run:
  name: infeas_sdplib_infeasible_scs_cudss_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
  datasets:
  - name: sdplib
    id: sdplib_infeasible
    include:
    - infd1
    - infd2
    - infp1
    - infp2
solvers:
- id: scs_cudss_1e-4
  solver: scs
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    max_iters: 1000000
    time_limit_secs: 900.0
    linear_solver: cudss
