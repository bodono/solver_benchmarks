run:
  name: infeas_sdplib_infeasible_clarabel_1e-8
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
  datasets:
  - name: sdplib
    id: sdplib_infeasible
    include:
    - infd1
    - infd2
    - infp1
    - infp2
solvers:
- id: clarabel_1e-8
  solver: clarabel
  settings:
    tol_feas: 1.0e-08
    tol_gap_abs: 1.0e-08
    tol_gap_rel: 1.0e-08
    time_limit: 900.0
