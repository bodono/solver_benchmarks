run:
  name: sdp_mittelmann_sdp_clarabel_1e-8_try_G40mc
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
  datasets:
  - name: mittelmann_sdp
    id: mittelmann_sdp
    include:
    - G40mc
    dataset_options:
      subset: all
solvers:
- id: clarabel_1e-8
  solver: clarabel
  settings:
    tol_feas: 1.0e-08
    tol_gap_abs: 1.0e-08
    tol_gap_rel: 1.0e-08
    time_limit: 900.0
