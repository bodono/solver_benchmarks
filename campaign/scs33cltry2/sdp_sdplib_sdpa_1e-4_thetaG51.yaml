run:
  name: sdp_sdplib_sdpa_1e-4_thetaG51
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
  datasets:
  - name: sdplib
    id: sdplib
    include:
    - thetaG51
solvers:
- id: sdpa_1e-4
  solver: sdpa
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    time_limit: 900.0
