run:
  name: lp_netlib_osqp_1e-5
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: netlib
    id: netlib
    dataset_options:
      subset: feasible
solvers:
- id: osqp_1e-5
  solver: osqp
  settings:
    eps_abs: 1.0e-05
    eps_rel: 1.0e-05
    max_iter: 1000000
    time_limit: 300.0
