run:
  name: sdp_mittelmann_sdp_sdpa_1e-4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
  datasets:
  - name: mittelmann_sdp
    id: mittelmann_sdp
    dataset_options:
      subset: all
solvers:
- id: sdpa_1e-4
  solver: sdpa
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    time_limit: 900.0
