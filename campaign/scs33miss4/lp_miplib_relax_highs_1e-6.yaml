run:
  name: lp_miplib_relax_highs_1e-6_miss4
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: miplib
    id: miplib_relax
    include:
    - mad
    - neos-2987310-joes
    - piperout-27
    - rococoC10-001000
solvers:
- id: highs_1e-6
  solver: highs
  settings:
    primal_feasibility_tolerance: 1.0e-06
    dual_feasibility_tolerance: 1.0e-06
    time_limit: 300.0
