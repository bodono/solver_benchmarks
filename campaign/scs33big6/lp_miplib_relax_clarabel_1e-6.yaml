run:
  name: lp_miplib_relax_clarabel_1e-6_big6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: miplib
    id: miplib_relax
    include:
    - square47
    - square41
    - neos-3402454-bohle
    - neos-2075418-temuka
    - supportcase19
    - neos-5114902-kasavu
solvers:
- id: clarabel_1e-6
  solver: clarabel
  settings:
    tol_feas: 1.0e-06
    tol_gap_abs: 1.0e-06
    tol_gap_rel: 1.0e-06
    time_limit: 300.0
